# Reverse proxy: Nginx on :80/:443 -> the app container on :8080.
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/rozzgaar-chatbot
#          sudo ln -s /etc/nginx/sites-available/rozzgaar-chatbot /etc/nginx/sites-enabled/
#          sudo rm -f /etc/nginx/sites-enabled/default
#          sudo nginx -t && sudo systemctl reload nginx
#
# Then for HTTPS: sudo certbot --nginx -d yourdomain.example.com
# (certbot rewrites this file to add the TLS server block automatically)

server {
    listen 80;
    server_name yourdomain.example.com;  # <-- replace with your real domain

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # TTS/STT responses can be sizeable audio blobs; chat can stream
        proxy_read_timeout 60s;
        client_max_body_size 20m;
    }
}
