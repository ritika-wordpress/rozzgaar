version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip install -r requirements.txt
run:
  runtime-version: 3.11
  command: uvicorn app.main:app --host 0.0.0.0 --port 8080
  network:
    port: 8080
    env: PORT
  env:
    # Placeholders only - real values are set as App Runner "Environment
    # variables" (plain) or "Environment secrets" (Secrets Manager / SSM)
    # in the console/CLI, never committed here.
    - name: DATA_DIR
      value: "./data"
